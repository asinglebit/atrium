name: CI

permissions:
  contents: write   # required for creating a release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'   # Trigger release on tags like v1.0.0
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  build:
    name: Build ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Unix only: atrium talks to its agents over a unix socket, and there is
      # no Windows equivalent wired up.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --all-features

      - name: Rename binary per OS
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            mv target/release/atrium target/release/atrium-linux
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv target/release/atrium target/release/atrium-macos
          fi
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-binary
          path: |
            target/release/atrium-linux
            target/release/atrium-macos

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run on tag push
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p artifacts_flat
          cp -r artifacts/*/* artifacts_flat/ || true
          ls -R artifacts_flat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts_flat/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
